[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'"

# Imágenes y datos del catálogo: caché larga en el navegador/CDN para que las
# visitas repetidas no vuelvan a descargar cientos de KB por producto.
[[headers]]
  for = "/assets/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Secciones ocultas de momento (ver assets/stock-status.js): redirigen a la home.
# Para reactivarlas, borra estas reglas y pon KICK_HAS_STOCK / KICK_HAS_TRACKING a true.
[[redirects]]
  from = "/stock.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/seguimiento.html"
  to = "/"
  status = 302
  force = true
